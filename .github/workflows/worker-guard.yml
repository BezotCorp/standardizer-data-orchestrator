name: Worker Guard

on:
  workflow_call:

jobs:
  dev-contains-main:
    name: dev contains main
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Require dev as source branch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event.pull_request.head.ref }}" != "dev" ]; then
            echo "::error::Pull requests into main must come from dev."
            exit 1
          fi

      - name: Check that dev contains main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          MISSING_IN_DEV=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...main" --jq .ahead_by)

          if [ "$MISSING_IN_DEV" != "0" ]; then
            echo "::error::dev is missing $MISSING_IN_DEV commit(s) from main. Synchronize main into dev before merging into main."
            exit 1
          fi

          echo "dev contains main."
